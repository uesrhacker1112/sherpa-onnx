workflows:
  ios-simulator:
    name: iOS Simulator Build
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
    scripts:
      - name: Resolve Swift packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project ios-swift/SherpaOnnxAsr/SherpaOnnxAsr.xcodeproj \
            -scheme SherpaOnnxAsr
      - name: Build for iOS Simulator
        script: |
          xcodebuild \
            -project ios-swift/SherpaOnnxAsr/SherpaOnnxAsr.xcodeproj \
            -scheme SherpaOnnxAsr \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - /Users/builder/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.app
